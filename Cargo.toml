[package]
name = "incognito-safe"
version = "0.1.0"
edition = "2024"
description = "Counterfactual Safe smart-account address generator and deployer"
license = "MIT"
repository = "https://github.com/worldcoin/incognito-safe"
rust-version = "1.94.1"

[dependencies]
alloy = { version = "2.0.1", features = ["signer-ledger", "signer-trezor"] }
anyhow = "1.0.98"
clap = { version = "4.5.59", features = ["derive", "env"] }
getrandom = "0.4.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
tempfile = "3.19.1"
time = { version = "0.3.45", features = ["formatting", "parsing"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
yaml-rust2 = { version = "0.10.4", default-features = false }
zeroize = "1.8.1"

[dev-dependencies]
alloy = { version = "2.0.1", features = ["provider-anvil-api", "node-bindings"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
